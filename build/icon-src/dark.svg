<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="tile"><rect x="112" y="112" width="800" height="800" rx="188"/></clipPath>

    <!-- tile glass body -->
    <linearGradient id="tileBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3a36" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#141b19" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#0b0f0e"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#6fe0b0" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#2f9c78" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2f9c78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#9fffd6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- bolt glass -->
    <linearGradient id="boltBody" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#d9fff0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#8ff0c4" stop-opacity="0.78"/>
      <stop offset="0.75" stop-color="#3fc596" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1f8f6c" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="boltRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#bfffe4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="boltHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur5" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <!-- inner-edge refraction: bright inside rim via blurred inverse -->
    <filter id="innerEdge" x="-5%" y="-5%" width="110%" height="110%">
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="9" result="b"/>
      <feComposite in="b" in2="SourceAlpha" operator="in" result="edge"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.55"/>
      <feComposite in2="edge" operator="in"/>
    </filter>
    <filter id="boltEdge" x="-10%" y="-10%" width="120%" height="120%">
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="7" result="b"/>
      <feComposite in="b" in2="SourceAlpha" operator="in" result="edge"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.8"/>
      <feComposite in2="edge" operator="in"/>
    </filter>

    <path id="boltPath" d="M598 228 L376 548 Q362 568 386 568 L468 568 L428 782 Q424 804 440 786 L664 466 Q678 446 654 446 L574 446 L616 250 Q620 226 598 228 Z"/>
  </defs>

  <!-- ground shadow -->
  <rect x="132" y="170" width="760" height="780" rx="188" fill="#000" opacity="0.5" filter="url(#shadow)"/>

  <!-- tile -->
  <g clip-path="url(#tile)">
    <rect x="112" y="112" width="800" height="800" fill="url(#tileBody)"/>
    <!-- caustic color blobs behind glass -->
    <circle cx="300" cy="260" r="170" fill="#4fd8a4" opacity="0.22" filter="url(#blur30)"/>
    <circle cx="760" cy="800" r="200" fill="#2a8f78" opacity="0.28" filter="url(#blur30)"/>
    <circle cx="800" cy="260" r="120" fill="#7fb8ff" opacity="0.12" filter="url(#blur30)"/>
    <rect x="112" y="112" width="800" height="800" fill="url(#innerGlow)"/>
    <!-- top sheen -->
    <path d="M112 112 H912 V420 Q512 520 112 420 Z" fill="url(#topSheen)" opacity="0.55"/>
    <!-- inner bright edge -->
    <rect x="112" y="112" width="800" height="800" rx="188" fill="#000" filter="url(#innerEdge)"/>
    <!-- bottom lift light -->
    <ellipse cx="512" cy="930" rx="340" ry="90" fill="#8fffd0" opacity="0.28" filter="url(#blur14)"/>
  </g>
  <!-- rim -->
  <rect x="113.5" y="113.5" width="797" height="797" rx="186.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <rect x="120" y="120" width="784" height="784" rx="180" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- bolt: soft drop + glow -->
  <use href="#boltPath" fill="#3fe0a0" opacity="0.55" filter="url(#blur30)" transform="translate(0 6)"/>
  <use href="#boltPath" fill="#000" opacity="0.5" filter="url(#blur14)" transform="translate(10 26)"/>

  <!-- bolt glass body -->
  <use href="#boltPath" fill="url(#boltBody)"/>
  <!-- inner refraction edge -->
  <use href="#boltPath" fill="#000" filter="url(#boltEdge)"/>
  <!-- upper facet highlight -->
  <g clip-path="none">
    <clipPath id="boltClip"><use href="#boltPath"/></clipPath>
    <g clip-path="url(#boltClip)">
      <path d="M400 230 L640 230 L560 420 L330 520 Z" fill="url(#boltHi)" opacity="0.55"/>
      <ellipse cx="520" cy="800" rx="150" ry="70" fill="#d6fff0" opacity="0.5" filter="url(#blur14)"/>
      <path d="M470 600 L430 790 L470 740 Z" fill="#fff" opacity="0.25" filter="url(#blur5)"/>
    </g>
  </g>
  <!-- bolt rim -->
  <use href="#boltPath" fill="none" stroke="url(#boltRim)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- specular glints -->
  <path d="M590 258 L430 490" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.8" filter="url(#blur2)"/>
  <circle cx="606" cy="244" r="7" fill="#fff" opacity="0.95" filter="url(#blur2)"/>
</svg>
